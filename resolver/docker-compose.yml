# BackstageHero resolver, just the resolver container.
#
# Listens on 8080 inside the container, published here on host port 8099.
# Point your own reverse proxy / tunnel (Cloudflare, Caddy, nginx, whatever) at
# the published port to serve it over HTTPS. See DEPLOY.md.
#
#   docker compose up -d --build      (or paste as a Portainer stack)

services:
  resolver:
    build: .
    container_name: backstagehero-resolver
    restart: unless-stopped
    # host:container. change the host port to any free port on your machine.
    ports:
      - "8099:8080"
    environment:
      BACKSTAGEHERO_DB: /data/resolver.sqlite3
      BACKSTAGEHERO_ADMIN_TOKEN: ${BACKSTAGEHERO_ADMIN_TOKEN}
      BACKSTAGEHERO_PUBLIC_URL: ${BACKSTAGEHERO_PUBLIC_URL}
      # Optional - AI "Suggest" pick and instant cache purges.
      BACKSTAGEHERO_LLM_KEY: ${BACKSTAGEHERO_LLM_KEY:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
    volumes:
      - backstagehero-data:/data

volumes:
  backstagehero-data:
